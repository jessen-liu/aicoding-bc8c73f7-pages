/*
 * Glassmorphism 试验皮肤（仅用于单文件试验版，不影响主线样式）
 * 色板严格限定：Base #6D5DF6 / 粉 #FF7AB8 / 青 #33D6C4 / 琥珀 #FFCF5C
 * 面板：白色 12%~18% 透明 + 24px 磨砂 + 1px 白边 + 顶部 inset 高光
 */
:root {
  --bg: #6d5df6;
  --surface: rgba(255, 255, 255, 0.12);
  --surface-2: rgba(255, 255, 255, 0.18);
  --ink: #ffffff;
  --ink2: rgba(255, 255, 255, 0.75);
  --ink3: rgba(255, 255, 255, 0.6);
  --line: rgba(255, 255, 255, 0.3);
  --line2: rgba(255, 255, 255, 0.45);
  --accent: #ffffff;
  --accent-soft: rgba(255, 255, 255, 0.18);
  --warn: #ffcf5c;
  --warn-soft: rgba(255, 207, 92, 0.18);
  --shadow: 0 8px 32px rgba(31, 38, 135, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  --radius: 16px;
}

/* 夜间模式下同样保持玻璃质感，不做深色不透明面板 */
[data-theme='dark'] {
  --bg: #4b3fd6;
  --surface: rgba(255, 255, 255, 0.12);
  --surface-2: rgba(255, 255, 255, 0.18);
  --ink: #ffffff;
  --ink2: rgba(255, 255, 255, 0.75);
  --ink3: rgba(255, 255, 255, 0.6);
  --line: rgba(255, 255, 255, 0.3);
  --line2: rgba(255, 255, 255, 0.45);
  --accent: #ffffff;
  --accent-soft: rgba(255, 255, 255, 0.18);
  --warn: #ffcf5c;
  --warn-soft: rgba(255, 207, 92, 0.18);
  --shadow: 0 8px 32px rgba(31, 38, 135, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

html,
body {
  background: #6d5df6;
  color: #ffffff;
}

.shell {
  position: relative;
  background:
    radial-gradient(460px 460px at 78% 84%, rgba(255, 207, 92, 0.55), transparent 70%),
    radial-gradient(520px 520px at 6% 6%, rgba(255, 122, 184, 0.6), transparent 70%),
    radial-gradient(520px 520px at 94% 22%, rgba(51, 214, 196, 0.55), transparent 70%),
    linear-gradient(158deg, #6d5df6 0%, #6a5bf3 48%, #5b4ae0 100%);
  background-attachment: fixed;
}

/* 顶栏：sticky 头部允许磨砂，避免滚动长列表时叠加模糊 */
.topbar {
  background: rgba(255, 255, 255, 0.1);
  border-bottom: 1px solid rgba(255, 255, 255, 0.28);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
}

.brand-mark {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.5);
  color: #ffffff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

.brand-text {
  color: #ffffff;
}

.nav-tab {
  color: rgba(255, 255, 255, 0.8);
  border-radius: 12px;
}

.nav-tab:hover {
  background: rgba(255, 255, 255, 0.16);
  color: #ffffff;
}

.nav-tab.active {
  background: rgba(255, 255, 255, 0.22);
  border-color: rgba(255, 255, 255, 0.35);
  color: #ffffff;
}

/* 按钮：主按钮用白色实心（规范 3.1），其余为玻璃幽灵按钮 */
.btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #ffffff;
  border-radius: 12px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.btn:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.45);
}

.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.btn:active {
  transform: translateY(1px);
}

.btn-primary {
  background: rgba(255, 255, 255, 0.92);
  border-color: rgba(255, 255, 255, 0.6);
  color: #3b2a8f;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(20, 10, 70, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.btn-primary:hover {
  background: #ffffff;
  filter: none;
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.22);
  color: #ffffff;
}

.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.18);
}

.btn-danger {
  color: #ffcf5c;
  border-color: rgba(255, 207, 92, 0.4);
}

.btn-danger:hover {
  background: rgba(255, 207, 92, 0.18);
  border-color: rgba(255, 207, 92, 0.5);
}

.btn:disabled {
  opacity: 0.45;
}

/* 玻璃面板 */
.card,
.filters,
.empty,
.paper-sheet,
.modal,
.flip-face,
.stat,
.hint {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 16px;
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.empty {
  border-style: dashed;
  border-color: rgba(255, 255, 255, 0.35);
}

.flip-face {
  box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.modal {
  background: rgba(60, 48, 170, 0.55);
}

/* 表单 */
input[type='text'],
input[type='search'],
textarea,
select {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  color: #ffffff;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

input::placeholder,
textarea::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

input:focus,
textarea:focus,
select:focus {
  border-color: rgba(255, 255, 255, 0.7);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3);
}

/* 原生下拉选项由系统绘制，保持浅底深字以保证可读 */
select option {
  background: #ffffff;
  color: #3b2a8f;
}

/* 标签与文字 */
.badge {
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #ffffff;
}

.badge-muted {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.22);
  color: rgba(255, 255, 255, 0.85);
}

.badge-warn {
  background: rgba(255, 207, 92, 0.2);
  border-color: rgba(255, 207, 92, 0.45);
  color: #ffcf5c;
}

.answer-label,
.q-meta,
.small,
.muted,
.page-desc,
.answer-text,
.paper-sub {
  color: rgba(255, 255, 255, 0.75);
}

.q-text,
.page-title,
.paper-title,
.modal-head h3,
.settings-block > strong {
  color: #ffffff;
}

.msg {
  color: #33d6c4;
}

.flip-hint,
.answer-label {
  color: rgba(255, 255, 255, 0.6);
}

.overlay {
  background: rgba(20, 10, 70, 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.hint {
  color: #ffffff;
}

/* 打印时切换为白纸黑字，避免玻璃面板打印不可读（非屏幕视觉规范） */
@media print {
  .shell {
    background: #ffffff;
  }
  .paper-sheet {
    background: #ffffff;
    color: #1f2328;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
  }
  .paper-title,
  .paper-q,
  .paper-no {
    color: #1f2328;
  }
  .paper-sub {
    color: #5b6068;
  }
  .paper-blank {
    border-bottom: 1px solid #cfc7b8;
  }
}
</style>
